name: Feature request
description: Suggest a capability or a change to the defaults
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not the implementation — what is awkward or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: |
        If this is about configuration, sketch the `config` block you wish worked.
      render: yaml

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including any workaround you use today (for example a `noDefer` list).

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about which tools the model is offered (this plugin's job)
        - label: This is about how tools execute or are approved (the harness' job, not this plugin's)
