version: 2

updates:
  # Keep the toolchain and the DSH peer/dev dependencies current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # The DSH packages must move in lockstep: peerDependencies pin exact
      # versions, so one PR per release keeps the bump reviewable.
      deepseek-ai:
        patterns:
          - '@deepseek-ai/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'

  # Keep the workflow actions themselves current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
